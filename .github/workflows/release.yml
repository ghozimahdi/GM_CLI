name: Build and Create PR to Homebrew

on:
  push:
    branches:
      - master

  workflow_dispatch:

env:
  HOMEBREW_TAP_REPO: ghozimahdi/homebrew-ghozimahdi-cli
  BINARY_NAME: gm

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build aarch64 (Apple Silicon)
        run: |
          cargo build --release --target aarch64-apple-darwin
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/${{ env.BINARY_NAME }} dist/
          cd dist
          tar -czvf ${{ env.BINARY_NAME }}-aarch64-apple-darwin.tar.gz ${{ env.BINARY_NAME }}
          rm ${{ env.BINARY_NAME }}

      - name: Build x86_64 (Intel)
        run: |
          cargo build --release --target x86_64-apple-darwin
          cp target/x86_64-apple-darwin/release/${{ env.BINARY_NAME }} dist/
          cd dist
          tar -czvf ${{ env.BINARY_NAME }}-x86_64-apple-darwin.tar.gz ${{ env.BINARY_NAME }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/*.tar.gz

  create-pr:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: artifacts

      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep -oP '^version = "\K[^"]+' Cargo.toml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Calculate SHA256
        id: sha256
        run: |
          cd artifacts
          AARCH64_SHA=$(sha256sum gm-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)
          X86_64_SHA=$(sha256sum gm-x86_64-apple-darwin.tar.gz | cut -d' ' -f1)
          echo "aarch64_sha=$AARCH64_SHA" >> $GITHUB_OUTPUT
          echo "x86_64_sha=$X86_64_SHA" >> $GITHUB_OUTPUT

      - name: Clone Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone https://x-access-token:${TAP_TOKEN}@github.com/${{ env.HOMEBREW_TAP_REPO }}.git homebrew-tap

      - name: Update formula
        run: |
          cd homebrew-tap
          VERSION="${{ steps.version.outputs.version }}"
          AARCH64_SHA="${{ steps.sha256.outputs.aarch64_sha }}"
          X86_64_SHA="${{ steps.sha256.outputs.x86_64_sha }}"

          sed -i "s/version \".*\"/version \"$VERSION\"/" gm.rb
          sed -i "s|releases/download/v[^/]*/gm-x86_64|releases/download/v$VERSION/gm-x86_64|g" gm.rb
          sed -i "s|releases/download/v[^/]*/gm-aarch64|releases/download/v$VERSION/gm-aarch64|g" gm.rb
          sed -i "0,/sha256 \"[a-f0-9]\{64\}\"/s/sha256 \"[a-f0-9]\{64\}\"/sha256 \"$X86_64_SHA\"/" gm.rb
          sed -i "0,/sha256 \"$X86_64_SHA\"/b; s/sha256 \"[a-f0-9]\{64\}\"/sha256 \"$AARCH64_SHA\"/" gm.rb

          echo "Updated gm.rb:"
          cat gm.rb

      - name: Create PR to Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          cd homebrew-tap
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH_NAME="version-$VERSION"

          # Copy tar.gz files
          cp ../artifacts/*.tar.gz .

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create new branch
          git checkout -b "$BRANCH_NAME"

          # Commit changes
          git add gm.rb *.tar.gz
          git commit -m "feat: update version to $VERSION and corresponding URLs"

          # Push branch
          git push -u origin "$BRANCH_NAME"

          # Create PR using gh CLI
          gh pr create \
            --repo "${{ env.HOMEBREW_TAP_REPO }}" \
            --title "Release v$VERSION" \
            --body "$(cat <<EOF
          ## GM CLI v$VERSION

          Automated release from private repo.

          ### Changes
          - Update version to $VERSION
          - Update SHA256 checksums
          - Add binary files

          ### SHA256 Checksums
          \`\`\`
          ${{ steps.sha256.outputs.aarch64_sha }}  gm-aarch64-apple-darwin.tar.gz
          ${{ steps.sha256.outputs.x86_64_sha }}  gm-x86_64-apple-darwin.tar.gz
          \`\`\`
          EOF
          )" \
            --base master \
            --head "$BRANCH_NAME"

          echo "✅ PR created for v$VERSION!"
