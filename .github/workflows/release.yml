name: Release

# Push a tag that matches the version in Cargo.toml (e.g. `git tag v4.0.1 && git push origin v4.0.1`).
# The workflow builds the macOS binaries, publishes them as a GitHub Release in this
# repository, and updates Formula/gm.rb on master with the checksums of those exact files.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v4.0.1)"
        required: true

permissions:
  contents: write

env:
  BINARY_NAME: gm

jobs:
  build:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Resolve tag
        id: tag
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Check tag matches Cargo.toml version
        id: version
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build and package
        run: |
          mkdir -p dist
          for TARGET in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --target "$TARGET"
            tar -czf "dist/${BINARY_NAME}-${TARGET}.tar.gz" -C "target/${TARGET}/release" "$BINARY_NAME"
          done
          cd dist && shasum -a 256 *.tar.gz | tee SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "GM CLI $TAG" \
            --generate-notes

      - name: Update Homebrew formula
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          AARCH64_SHA=$(awk '/aarch64-apple-darwin/ {print $1}' dist/SHA256SUMS)
          X86_64_SHA=$(awk '/x86_64-apple-darwin/ {print $1}' dist/SHA256SUMS)
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"

          cat > Formula/gm.rb <<FORMULA
          class Gm < Formula
            desc "GM CLI tool for managing Flutter projects"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            version "${VERSION}"

            on_macos do
              on_arm do
                url "${BASE}/gm-aarch64-apple-darwin.tar.gz"
                sha256 "${AARCH64_SHA}"
              end
              on_intel do
                url "${BASE}/gm-x86_64-apple-darwin.tar.gz"
                sha256 "${X86_64_SHA}"
              end
            end

            def install
              bin.install "gm"
            end

            test do
              system bin/"gm", "--help"
            end
          end
          FORMULA
          sed -i 's/^          //' Formula/gm.rb
          echo "Generated Formula/gm.rb:"
          cat Formula/gm.rb

      - name: Commit formula
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/gm.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date"
            exit 0
          fi
          git commit -m "chore(formula): update gm to v${VERSION}"
          git push origin master
