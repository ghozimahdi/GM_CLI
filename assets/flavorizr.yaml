  - ios:xcconfig
  - ios:buildTargets
  - ios:schema
  - ios:dummyAssets
  - ios:icons
  - ios:plist
  - ios:launchScreen
  - macos:podfile
  - macos:xcconfig
  - macos:configs
  - macos:buildTargets
  - macos:schema
